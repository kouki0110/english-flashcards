
name: Daily English Phrases

on:
  schedule:
    - cron: '30 7 * * *'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-english-phrases
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Add five new phrases
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, re, urllib.request, urllib.error
          from zoneinfo import ZoneInfo

          BASE = 'https://qwjjfberpnxbczbxzpnl.supabase.co/rest/v1/phrases'
          TODAY = datetime.datetime.now(ZoneInfo('Asia/Tokyo')).date().isoformat()
          DB_HEADERS = {'apikey': os.environ['SUPABASE_SECRET_KEY'],
                        'Content-Type': 'application/json'}

          def http(url, headers, data=None, method='GET'):
              body = json.dumps(data, ensure_ascii=False).encode('utf-8') if data is not None else None
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=90) as response:
                      raw = response.read().decode('utf-8')
                  return json.loads(raw) if raw else None
              except urllib.error.HTTPError as e:
                  raise RuntimeError(f'HTTP {e.code}: {e.read().decode()[:500]}') from e

          done = http(f'{BASE}?select=publish_slot&publish_date=eq.{TODAY}', DB_HEADERS)
          missing = [n for n in range(1, 6) if n not in {v['publish_slot'] for v in done}]
          if not missing:
              print(f'{TODAY}: already has five phrases. Skipping.')
              raise SystemExit(0)

          existing = []
          for offset in range(0, 100000, 1000):
              rows = http(f'{BASE}?select=phrase&order=id.asc&limit=1000&offset={offset}', DB_HEADERS)
              existing.extend(v['phrase'] for v in rows)
              if len(rows) < 1000:
                  break

          # Already learned in chat, but not included in the initial 15.
          existing += ["I'm down.", 'Give me a sec.', "I'm good.", 'My bad.', "I'm on it."]
          normalized = lambda s: re.sub(r'[^a-z0-9]', '', s.casefold())
          used = {normalized(s) for s in existing}
          prompt = ('日本語で説明する初級〜中級の英会話学習アプリ用です。'
                    '日常会話で頻出する、短く自然で互いに異なる英語フレーズを15件作成してください。'
                    '各件にphrase（英語）, meaning（日本語と使用場面）, example_en（英語例文）, '
                    'example_ja（例文の自然な日本語訳）を含めてください。'
                    '既習フレーズと重複しないこと。JSON形式で返してください。'
                    '\n既習フレーズ：\n' + '\n'.join(existing[-200:]))
          fields = {key: {'type': 'string'} for key in ('phrase', 'meaning', 'example_en', 'example_ja')}
          schema = {'type': 'object', 'properties': {'items': {
              'type': 'array', 'items': {'type': 'object', 'properties': fields,
                                        'required': list(fields), 'additionalProperties': False}}},
                    'required': ['items'], 'additionalProperties': False}
          completion = http('https://api.openai.com/v1/chat/completions',
              {'Authorization': 'Bearer ' + os.environ['OPENAI_API_KEY'],
               'Content-Type': 'application/json'},
              {'model': 'gpt-4.1-mini',
               'messages': [{'role': 'user', 'content': prompt}],
               'response_format': {'type': 'json_schema',
                                   'json_schema': {'name': 'daily_phrases',
                                                   'strict': True, 'schema': schema}}}, 'POST')
          candidates = json.loads(completion['choices'][0]['message']['content'])['items']
          selected = []
          for item in candidates:
              phrase = item['phrase'].strip()
              key = normalized(phrase)
              if not key or key in used or any(not item[k].strip() for k in fields):
                  continue
              used.add(key)
              selected.append({**{k: item[k].strip() for k in fields},
                               'publish_date': TODAY, 'publish_slot': missing[len(selected)]})
              if len(selected) == len(missing):
                  break
          if len(selected) != len(missing):
              raise RuntimeError('Not enough unique phrases generated; retry the workflow.')

          inserted = http(BASE + '?on_conflict=phrase',
              {**DB_HEADERS, 'Prefer': 'resolution=ignore-duplicates,return=representation'},
              selected, 'POST')
          if len(inserted) != len(selected):
              raise RuntimeError('Some phrases conflicted and were not inserted. Rerun manually.')
          print(f'{TODAY}: added {len(inserted)} phrases successfully.')
          PY
